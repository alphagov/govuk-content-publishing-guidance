name: Build image from PR

# Lets govuk-preview-app preview any branch, not just main: ImageResolver
# looks up ghcr.io/alphagov/govuk/govuk-content-publishing-guidance tagged
# with a branch's own HEAD commit SHA, and waits for it to appear.
# github.event.pull_request.head.sha is that same SHA (the PR branch's
# real tip, not GitHub's synthetic merge commit).
#
# Depends on a Dockerfile at the repo root running the Eleventy dev server
# - this static site has never had one before, since production deploys
# via GitHub Pages (see deploy-github-pages.yml), not a running container;
# see Dockerfile's own comment for details.
on:
  pull_request:

concurrency:
  group: build-image-from-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build-and-publish-image:
    name: Build and publish image
    uses: alphagov/govuk-infrastructure/.github/workflows/build-push-arm-image.yml@main
    with:
      gitRef: ${{ github.event.pull_request.head.sha }}
    permissions:
      id-token: write
      contents: read
      packages: write
